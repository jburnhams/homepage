name: Tests
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # lockfile, ruff, ruff format, pyright strict, ty and the unit tests with coverage
      - run: scripts/check
