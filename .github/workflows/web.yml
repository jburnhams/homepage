name: Web
on:
  push: { branches: [main], paths: ["web/**", ".github/workflows/web.yml"] }
  pull_request: { branches: [main], paths: ["web/**", ".github/workflows/web.yml"] }
  # Run by hand on a branch to rewrite the baselines in CI's own Chromium and commit them there.
  workflow_dispatch:
    inputs:
      update_baselines: { type: boolean, default: false }
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ is committed (the server runs without Node), so it must match a fresh build.
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - if: inputs.update_baselines
        run: |
          npx strata-visual --update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baselines
          git diff --cached --quiet || git commit -m "Update visual baselines (CI Chromium)"
          git push
      - if: "!inputs.update_baselines"
        run: npx strata-visual
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: visual-diffs, path: web/tests/visual/output/, if-no-files-found: ignore }
