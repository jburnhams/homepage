name: Web
on:
  push: { branches: [main], paths: ["web/**", ".github/workflows/web.yml"] }
  pull_request: { branches: [main], paths: ["web/**", ".github/workflows/web.yml"] }
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ is committed (the server runs without Node), so it must match a fresh build.
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - run: npx strata-visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: visual-diffs, path: web/tests/visual/output/, if-no-files-found: ignore }
